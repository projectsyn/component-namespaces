parameters:
  namespaces:
    =_metadata:
      multi_instance: true
      multi_tenant: true

    ignoreList:
      - default
      - kube
      - syn

    namespaces: {}

    labelSync:
      ignoreNames: []
      ignorePrefixes:
        - cilium
        - kube
        - openshift
        - appuio
        - syn
      applyOnPrefix: {}
